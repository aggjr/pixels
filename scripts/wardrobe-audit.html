<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>PIXELS · revisão do elenco</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f1ff;color:#30254a;font:15px system-ui}header{padding:22px 32px;background:white;position:sticky;top:0;z-index:2;border-bottom:1px solid #ddd}h1{margin:0 0 8px;font-size:24px}p{margin:8px 0;color:#675779}label{display:inline-flex;gap:8px;align-items:center;margin:8px 20px 0 0}select{padding:9px;border:1px solid #b9a5d7;border-radius:12px;background:white;color:inherit}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;padding:24px}article{background:white;border-radius:22px;overflow:hidden;border:1px solid #e5d9f4}h2{margin:16px 16px 0;font-size:17px}small{display:block;padding:8px 16px 16px;color:#74627e}.scene{height:235px;position:relative;background:linear-gradient(#dff5ff,#f1fff3 79%,#cfe9c5 80%);overflow:hidden}.sprite{position:absolute;inset:10px 15px;width:calc(100% - 30px);height:215px;object-fit:contain;object-position:center bottom}.piece{position:absolute;transform:translate(-50%,-50%);height:auto;pointer-events:none}footer{padding:0 32px 32px;color:#675779}.missing{border:3px solid #db3754}
</style>
<header><h1>PIXELS · todo o elenco</h1><p>30 aparências · 4 fases. Conferência de encaixes; não é aprovação da qualidade final das artes.</p>
<label>Fase <select id="stage"><option value="1">Recém-nascido</option><option value="2">Bebê</option><option value="3" selected>Criança</option><option value="4">Crescido</option></select></label>
<label>Peça <select id="item"><option value="sample">Combinação de referência</option><option value="none">Sem acessórios</option></select></label>
</header><main id="cast"></main><footer>Peças incompatíveis não são aplicadas. Movimentos, alimentação e sono precisam de revisão no jogo, além desta conferência estática.</footer>
<script src="/catalog.js"></script><script src="/wardrobe.js"></script><script>
const {SPECIES,SPECIES_ANCHORS,CLOSET_ITEMS}=PixelsCatalog;
const picker=document.getElementById('item'),stagePicker=document.getElementById('stage'),cast=document.getElementById('cast');
for(const item of CLOSET_ITEMS.filter(i=>i.slot&&!i.completeLook)){const o=document.createElement('option');o.value=item.id;o.textContent=item.name;picker.append(o)}
let observers=[];
function draw(){observers.forEach(o=>o.disconnect());observers=[];cast.replaceChildren();const stage=Number(stagePicker.value);
for(const species of SPECIES.filter(s=>s.ready))for(const variant of Object.keys(species.variants||{default:{}})){
 const key=species.id+(species.variants?'_'+variant:'');const card=document.createElement('article');const title=document.createElement('h2');title.textContent=species.name+(species.variants?' · '+variant:'');card.append(title);
 const scene=document.createElement('div');scene.className='scene';const img=document.createElement('img');img.className='sprite';img.alt=title.textContent;img.src='/assets/pets/'+key+'_'+species.stages[stage]+'.webp';scene.append(img);card.append(scene);
 let ids=picker.value==='sample'?['hat_bow_pink','face_glasses_ocean','neck_scarf_3d']:picker.value==='none'?[]:[picker.value];
 if(picker.value==='sample'&&species.diet==='machine')ids=['tune_siren_3d','face_glasses_gold'];
 const items=ids.map(id=>CLOSET_ITEMS.find(i=>i.id===id)).filter(i=>PixelsWardrobe.compatible(species.id,i));const note=document.createElement('small');note.textContent=items.map(i=>i.name).join(' · ')||'Sem peças compatíveis nesta seleção';card.append(note);cast.append(card);
 const place=()=>{scene.querySelectorAll('.piece').forEach(n=>n.remove());const fit=Math.min(img.clientWidth/img.naturalWidth,img.clientHeight/img.naturalHeight);const w=img.naturalWidth*fit,h=img.naturalHeight*fit;const anchors=PixelsWardrobe.anchorsFor({species,variant,stage},SPECIES_ANCHORS);for(const item of items){const a=PixelsWardrobe.fit(anchors,item);if(!a){card.classList.add('missing');continue}const piece=document.createElement('img');piece.className='piece';piece.alt=item.name;piece.src='/'+item.art;piece.style.left=15+(img.clientWidth-w)/2+w*a[0]+'px';piece.style.top=10+img.clientHeight-h+h*a[1]+'px';piece.style.width=w*a[2]+'px';piece.style.rotate=a[3]+'deg';scene.append(piece)}};
 img.onload=place;img.onerror=()=>card.classList.add('missing');const observer=new ResizeObserver(()=>{if(img.naturalWidth)place()});observer.observe(scene);observers.push(observer);
}}
picker.onchange=draw;stagePicker.onchange=draw;draw();
</script></html>
