<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>PIXELS · revisão do elenco</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f1ff;color:#30254a;font:15px system-ui}header{padding:22px 32px;background:white;position:sticky;top:0;z-index:2;border-bottom:1px solid #ddd}h1{margin:0 0 8px;font-size:24px}p{margin:8px 0;color:#675779}label{display:inline-flex;gap:8px;align-items:center;margin:8px 20px 0 0}select{padding:9px;border:1px solid #b9a5d7;border-radius:12px;background:white;color:inherit}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;padding:24px}article{background:white;border-radius:22px;overflow:hidden;border:1px solid #e5d9f4}h2{margin:16px 16px 0;font-size:17px}small{display:block;padding:8px 16px 16px;color:#74627e}.scene{height:235px;position:relative;background:linear-gradient(#dff5ff,#f1fff3 79%,#cfe9c5 80%);overflow:hidden}.sprite{z-index:2;position:absolute;inset:10px 15px;width:calc(100% - 30px);height:215px;object-fit:contain;object-position:center bottom}.piece{position:absolute;transform:translate(-50%,-50%);height:auto;pointer-events:none}footer{padding:0 32px 32px;color:#675779}.missing{border:3px solid #db3754}main{grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;padding:14px}h2{font-size:12px;margin:10px 8px 0}small{font-size:10px;padding:6px 8px}.scene{height:155px}.sprite{inset:5px 8px;width:calc(100% - 16px);height:145px}
</style>
<header><h1>PIXELS · todo o elenco</h1><p>30 aparências · 4 fases. Conferência de encaixes; não é aprovação da qualidade final das artes.</p>
<label>Fase <select id="stage"><option value="all">Todas as fases</option><option value="1">Recém-nascido</option><option value="2">Bebê</option><option value="3" selected>Criança</option><option value="4">Crescido</option></select></label>
<label>Peça <select id="item"><option value="gallery">Galeria das peças</option><option value="sample">Combinação de referência</option><option value="none">Sem acessórios</option></select></label>
<span id="auditReady" role="status">Carregando</span></header><main id="cast"></main><footer>Peças incompatíveis não são aplicadas. Movimentos, alimentação e sono precisam de revisão no jogo, além desta conferência estática.</footer>
<script src="/catalog.js"></script><script src="/wardrobe.js"></script><script>
const {SPECIES,SPECIES_ANCHORS,CLOSET_ITEMS}=PixelsCatalog;
const picker=document.getElementById('item'),stagePicker=document.getElementById('stage'),cast=document.getElementById('cast');
for(const item of CLOSET_ITEMS.filter(i=>i.slot)){const o=document.createElement('option');o.value=item.id;o.textContent=item.name;picker.append(o)}
let observers=[],auditRevision=0;
function settled(revision){Promise.all([...document.images].map(img=>img.decode().catch(()=>null))).then(()=>{if(revision===auditRevision)document.querySelector('#auditReady').textContent=[...document.images].every(i=>i.naturalWidth)?'Pronto':'Falha de imagem'})}
function draw(){const revision=++auditRevision;document.querySelector('#auditReady').textContent='Carregando';observers.forEach(o=>o.disconnect());observers=[];cast.replaceChildren();
if(picker.value==="gallery"){
 for(const item of [...CLOSET_ITEMS,...Object.entries({happy:'lili-dressed-photo',sleep:'lili-dressed-sleep',sad:'lili-dressed-sad',eat:'lili-dressed-eat',chew:'lili-dressed-chew'}).map(([id,file])=>({name:'Lili · '+id,art:'assets/pets/'+file+'.png'}))]){
 const card=document.createElement('article'),title=document.createElement('h2'),img=document.createElement('img');title.textContent=item.name;if(item.art)img.src='/'+item.art;else{img.remove();const emoji=document.createElement('div');emoji.textContent=item.emoji;Object.assign(emoji.style,{height:'155px',display:'grid',placeItems:'center',fontSize:'70px'});card.append(emoji)}img.alt=item.name;Object.assign(img.style,{width:'100%',height:'155px',objectFit:'contain',background:'#dff5ff'});card.prepend(title);if(item.art)card.append(img);cast.append(card);
 }settled(revision);return;
}
const stages=stagePicker.value==="all"?[1,2,3,4]:[Number(stagePicker.value)];
for(const species of SPECIES.filter(s=>s.ready))for(const variant of Object.keys(species.variants||{default:{}}))for(const stage of stages){
 if(!["sample","none"].includes(picker.value)&&!PixelsWardrobe.compatible(species.id,CLOSET_ITEMS.find(i=>i.id===picker.value)))continue;
 const key=species.id+(species.variants?'_'+variant:'');const card=document.createElement('article');const title=document.createElement('h2');title.textContent=species.name+(species.variants?' · '+variant:'')+' · '+['','Nascimento','Bebê','Criança','Crescido'][stage];card.append(title);
 const scene=document.createElement('div');scene.className='scene';const img=document.createElement('img');img.className='sprite';img.alt=title.textContent;const selected=CLOSET_ITEMS.find(i=>i.id===picker.value);img.src='/'+(selected?.completeLook?selected.art:PixelsCatalog.spriteArt(species,stage,variant));scene.append(img);card.append(scene);
 let ids=picker.value==='sample'?['hat_bow_pink','face_glasses_ocean','neck_scarf_3d']:picker.value==='none'?[]:[picker.value];
 if(picker.value==='sample'&&species.diet==='machine')ids=['tune_siren_3d','face_glasses_gold'];
 const items=ids.map(id=>CLOSET_ITEMS.find(i=>i.id===id)).filter(i=>!i.completeLook&&PixelsWardrobe.compatible(species.id,i));const note=document.createElement('small');note.textContent=items.map(i=>i.name).join(' · ')||'Sem peças compatíveis nesta seleção';card.append(note);cast.append(card);
 const place=()=>{scene.querySelectorAll('.piece').forEach(n=>n.remove());const fit=Math.min(img.clientWidth/img.naturalWidth,img.clientHeight/img.naturalHeight);const w=img.naturalWidth*fit,h=img.naturalHeight*fit;const anchors=PixelsWardrobe.anchorsFor({species,variant,stage},SPECIES_ANCHORS);for(const item of items){const mounts=PixelsWardrobe.mounts(species,stage,anchors,item);if(!mounts.length){card.classList.add('missing');continue}for(const a of mounts){const piece=document.createElement('img');piece.className='piece';piece.style.zIndex=item.slot==='wings'?1:5;piece.alt=item.name;piece.src='/'+item.art;piece.style.left=8+(img.clientWidth-w)/2+w*a[0]+'px';piece.style.top=5+img.clientHeight-h+h*a[1]+'px';piece.style.width=w*a[2]+'px';piece.style.rotate=a[3]+'deg';piece.style.transform='translate(-50%,-50%) scaleX('+a[4]+')';scene.append(piece)}}};
 img.onload=place;img.onerror=()=>card.classList.add('missing');const observer=new ResizeObserver(()=>{if(img.naturalWidth)place()});observer.observe(scene);observers.push(observer);
}settled(revision);}
picker.onchange=draw;stagePicker.onchange=draw;draw();
</script></html>
