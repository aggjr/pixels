<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIXELS · imagens e poses</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f1fa;color:#332744;font:14px system-ui}header{padding:18px 24px;background:white}h1{margin:0 0 8px;font-size:24px}select{padding:8px;border:1px solid #bdaed0;border-radius:9px}main{padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}article{background:white;border:1px solid #e0d7eb;border-radius:16px;overflow:hidden}img{width:100%;height:125px;object-fit:contain;background:repeating-conic-gradient(#d8ebed 0 25%,#f3fcfb 0 50%) 50%/20px 20px}p{margin:8px 10px;font-size:11px;overflow-wrap:anywhere}.flag{border:2px solid #c4456a}.flag p{color:#a22649}#status{margin-left:12px}</style>
<header><h1>PIXELS · conferência geral de imagens</h1><label>Grupo <select id="group"></select></label><span id="status" role="status">Carregando</span><p>Inclui fontes antigas e arquivos não usados no jogo. Transparência aparece sobre quadriculado. Conferência de poses e arte; não substitui testar a animação dentro do jogo.</p></header><main id="images"></main>
<script>
let inventory,revision=0;
const group=document.querySelector('#group'),container=document.querySelector('#images'),status=document.querySelector('#status');
async function draw(){const id=++revision;status.textContent='Carregando';container.replaceChildren();const files=inventory.files.filter(f=>group.value==='unused-characters'?['pets/bunny','pets/dragon','pets/fox','pets/hamster','pets/panda','pets/puppy','pets/robot'].includes(f.group):f.group===group.value);for(const file of files){const card=document.createElement('article'),img=document.createElement('img'),caption=document.createElement('p');card.className=file.reviewFlags.length?'flag':'';img.src='/'+file.path;img.alt=file.path;caption.textContent=file.path+' · '+file.width+'×'+file.height+(file.reviewFlags.length?' · '+file.reviewFlags.join(', '):'');card.append(img,caption);container.append(card)}await Promise.all([...container.querySelectorAll('img')].map(i=>i.decode().catch(()=>null)));await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));if(id===revision)status.textContent=[...container.querySelectorAll('img')].every(i=>i.naturalWidth)?'Pronto':'Falha de imagem'}
fetch('/image-inventory.json').then(r=>r.json()).then(data=>{inventory=data;for(const key of [...new Set(data.files.map(f=>f.group))].sort()){const option=document.createElement('option');option.value=key;option.textContent=key+' ('+data.files.filter(f=>f.group===key).length+')';group.append(option)}const extra=document.createElement('option');extra.value='unused-characters';extra.textContent='Personagens ainda não liberados';group.append(extra);group.onchange=draw;draw()});
</script></html>
